<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Dashboard - Auditorio Poligran</title>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<header>
  <div class="brand">
    <img src="/images/poli-logo.jpg" alt="Politecnico Grancolombiano"/>
    <div>
      <h1>Auditorio Institucional</h1>
      <small>Politecnico Grancolombiano</small>
    </div>
  </div>
  <nav>
    <a href="/dashboard">Inicio</a>
    <a href="/calendario">Calendario</a>
    <a sec:authorize="hasRole('SOLICITANTE')" href="/reservas/nueva">Nueva reserva</a>
    <a sec:authorize="hasRole('ADMIN_AUDITORIO')" href="/admin/aprobaciones">Aprobaciones</a>
    <a sec:authorize="hasRole('ADMIN_AUDITORIO')" href="/admin/usuarios">Usuarios</a>
    <a sec:authorize="hasRole('ADMIN_AUDITORIO')" href="/admin/tarifas">Tarifas</a>
    <a sec:authorize="hasRole('ADMIN_AUDITORIO')" href="/admin/bloqueos">Bloqueos</a>
    <a sec:authorize="hasAnyRole('ADMIN_AUDITORIO','OPERATIVO')" href="/reportes">Reportes</a>
    <form method="post" action="/logout" style="display:inline">
      <button class="btn btn-amarillo" type="submit">Salir</button>
    </form>
  </nav>
</header>
<main>
  <div class="card">
    <h2>Hola, <span th:text="${usuario.nombre}"></span></h2>
    <p>Rol: <b th:text="${usuario.rol}"></b>
       <span th:if="${usuario.tipoSolicitante != null}">(<span th:text="${usuario.tipoSolicitante}"></span>)</span></p>
    <div sec:authorize="hasRole('ADMIN_AUDITORIO')">
      <p><b th:text="${pendientes}"></b> reservas pendientes de aprobacion</p>
    </div>
  </div>

  <div class="card">
    <h3>Reservas</h3>
    <div th:if="${param.ok}" class="ok">Reserva creada correctamente</div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Solicitante</th>
          <th>Inicio</th>
          <th>Fin</th>
          <th>Seccion</th>
          <th>Tipo</th>
          <th>Estado</th>
          <th>Costo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${reservas}">
          <td th:text="${r.id}"></td>
          <td th:text="${r.solicitante.nombre}"></td>
          <td th:text="${#temporals.format(r.inicio,'yyyy-MM-dd HH:mm')}"></td>
          <td th:text="${#temporals.format(r.fin,'yyyy-MM-dd HH:mm')}"></td>
          <td th:text="${r.seccion}"></td>
          <td th:text="${r.tipoEvento}"></td>
          <td><span class="badge" th:classappend="${'b-' + r.estado}" th:text="${r.estado}"></span></td>
          <td th:text="${r.costo}"></td>
          <td>
            <form sec:authorize="hasAnyRole('SOLICITANTE','ADMIN_AUDITORIO')"
                  th:if="${r.estado.name() == 'PENDIENTE' or r.estado.name() == 'APROBADA'}"
                  th:action="@{|/reservas/${r.id}/cancelar|}" method="post" style="display:inline">
              <button class="btn btn-rojo" type="submit">Cancelar</button>
            </form>
            <span sec:authorize="hasRole('OPERATIVO')"
                  style="color:#666;font-style:italic">Solo lectura</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
