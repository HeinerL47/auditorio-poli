<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Aprobaciones</title>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<header>
  <div class="brand">
    <img src="/images/poli-logo.jpg" alt="Politecnico Grancolombiano"/>
    <div>
      <h1>Aprobaciones pendientes</h1>
      <small>Politecnico Grancolombiano</small>
    </div>
  </div>
  <nav><a href="/dashboard">Volver</a></nav>
</header>
<main>
  <div class="card">
    <div th:if="${ok}" class="ok" th:text="${ok}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <table>
      <thead><tr><th>#</th><th>Solicitante</th><th>Inicio</th><th>Fin</th>
        <th>Seccion</th><th>Tipo</th><th>Costo</th><th>Acciones</th></tr></thead>
      <tbody>
        <tr th:each="r : ${pendientes}">
          <td th:text="${r.id}"></td>
          <td th:text="${r.solicitante.nombre + ' (' + r.solicitante.rol + ')'}"></td>
          <td th:text="${#temporals.format(r.inicio,'yyyy-MM-dd HH:mm')}"></td>
          <td th:text="${#temporals.format(r.fin,'yyyy-MM-dd HH:mm')}"></td>
          <td th:text="${r.seccion}"></td>
          <td th:text="${r.tipoEvento}"></td>
          <td th:text="${r.costo}"></td>
          <td>
            <a class="btn" th:href="@{|/admin/reservas/${r.id}/editar|}">Editar</a>
            <form th:action="@{|/admin/aprobar/${r.id}|}" method="post" style="display:inline">
              <button class="btn btn-verde">Aprobar</button>
            </form>
            <form th:action="@{|/admin/rechazar/${r.id}|}" method="post" style="display:inline"
                  onsubmit="var m=this.motivo.value.trim(); if(!m){alert('Indique el motivo del rechazo');return false;} return true;">
              <input name="motivo" placeholder="Motivo de rechazo" required style="width:auto;display:inline-block;min-width:180px"/>
              <button class="btn btn-rojo">Rechazar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pendientes)}"><td colspan="8">Sin pendientes</td></tr>
      </tbody>
    </table>
  </div>
</main>
<script src="/js/session-guard.js"></script>
</body>
</html>
