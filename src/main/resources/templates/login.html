<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Iniciar sesión - Auditorio Poli</title>
  <link rel="stylesheet" th:href="@{/css/styles.css(v=2)}"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* ── Split layout ─────────────────────────────── */
    .split-screen {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* LEFT — imagen completa sin filtros (URL inyectada por Thymeleaf via th:style) */
    .split-left {
      flex: 1 1 60%;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /* RIGHT — panel de login */
    .split-right {
      flex: 0 0 420px;
      width: 420px;
      background: #0F385A;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 40px;
      box-shadow: -6px 0 32px rgba(0,0,0,0.25);
    }

    .split-right .login-logo {
      width: 120px;
      height: auto;
      margin-bottom: 20px;
    }

    .split-right h2 {
      color: #ffffff;
      font-size: 1.55rem;
      font-weight: 700;
      margin: 0 0 28px 0;
      text-align: center;
      letter-spacing: .3px;
    }

    /* Mensajes de alerta */
    .split-right .error {
      background: rgba(236,6,119,.18);
      border: 1px solid #EC0677;
      color: #fff;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: .88rem;
      margin-bottom: 14px;
      width: 100%;
      text-align: center;
    }
    .split-right .ok {
      background: rgba(166,206,56,.18);
      border: 1px solid #A6CE38;
      color: #fff;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: .88rem;
      margin-bottom: 14px;
      width: 100%;
      text-align: center;
    }

    /* Formulario */
    .split-right form {
      width: 100%;
    }

    .split-right label {
      display: block;
      color: #b8d4e8;
      font-size: .83rem;
      font-weight: 600;
      letter-spacing: .4px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .split-right input[type="email"],
    .split-right input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,0.10);
      border: 1.5px solid rgba(255,255,255,0.22);
      border-radius: 7px;
      color: #ffffff;
      font-size: .97rem;
      padding: 11px 14px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    .split-right input[type="email"]::placeholder,
    .split-right input[type="password"]::placeholder { color: rgba(255,255,255,.4); }
    .split-right input[type="email"]:focus,
    .split-right input[type="password"]:focus {
      border-color: #1FB2DE;
      background: rgba(255,255,255,0.15);
    }

    .split-right .btn-login {
      width: 100%;
      background: #1FB2DE;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      transition: background .2s, transform .1s;
      margin-top: 4px;
      letter-spacing: .3px;
    }
    .split-right .btn-login:hover  { background: #17a0c9; }
    .split-right .btn-login:active { transform: scale(.98); }

    .split-right .link-registro {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: rgba(255,255,255,.65);
      font-size: .9rem;
    }
    .split-right .link-registro a {
      color: #FBAF17;
      font-weight: 700;
      text-decoration: none;
    }
    .split-right .link-registro a:hover { text-decoration: underline; }

    /* Franja inferior del panel */
    .split-right-footer {
      margin-top: 32px;
      color: rgba(255,255,255,.35);
      font-size: .74rem;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Responsive: apilado en pantallas pequeñas ─ */
    @media (max-width: 700px) {
      html, body { overflow: auto; }
      .split-screen { flex-direction: column; height: auto; min-height: 100vh; }
      .split-left   { flex: 0 0 220px; height: 220px; }
      .split-right  { flex: 1 1 auto; width: 100%; padding: 36px 24px; }
    }
  </style>
</head>
<body>
<div class="split-screen">

  <!-- IZQUIERDA: imagen del edificio sin ningún filtro -->
  <!-- th:style inyecta la URL correcta para local Y Render (respeta el context-path) -->
  <div class="split-left"
       th:style="|background-image: url('@{/images/poli-edificio.jpg}');|"
       style="background-image: url('/images/poli-edificio.jpg');"></div>

  <!-- DERECHA: formulario de login -->
  <div class="split-right">
    <img th:src="@{/images/poli-logo.jpg(v=2)}" src="/images/poli-logo.jpg"
         alt="Politécnico Grancolombiano" class="login-logo"/>
    <h2>Iniciar sesión</h2>

    <div th:if="${param.error}"      class="error">Credenciales inválidas</div>
    <div th:if="${param.logout}"     class="ok">Sesión cerrada correctamente</div>
    <div th:if="${param.expired}"    class="error">Tu sesión fue cerrada. Ingresa de nuevo para continuar.</div>
    <div th:if="${param.registered}" class="ok">Registro exitoso, ya puedes iniciar sesión</div>

    <form method="post" action="/login" id="formLogin" autocomplete="off">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" required autofocus placeholder="usuario@poligran.edu.co"/>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="••••••••"/>

      <button class="btn-login" type="submit">Entrar</button>
    </form>

    <p class="link-registro">
      ¿Eres externo? <a th:href="@{/registro}">Crea tu cuenta</a>
    </p>

    <div class="split-right-footer">
      &copy; Politécnico Grancolombiano<br/>Somos diferentes, somos Poli.
    </div>
  </div>

</div>
<script th:src="@{/js/login-session.js(v=2)}"></script>
</body>
</html>
