<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-store"/>
  <script src="/js/session-guard-head.js?v=3"></script>
  <title>Calendario - Auditorio</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>
    .leyenda { display:flex; flex-wrap:wrap; gap:.8rem 1.4rem; margin-bottom:1.2rem; font-size:.87rem; align-items:center; }
    .leyenda-item { display:flex; align-items:center; gap:.4rem; }
    .leyenda-dot { width:14px; height:14px; border-radius:3px; flex-shrink:0; }
    .filtros-cal { display:flex; flex-wrap:wrap; gap:1rem; align-items:flex-end; margin-bottom:1rem; }
    .filtros-cal label { margin:0; }
    .filtros-cal select { width:auto; min-width:140px; }
  </style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/images/poli-logo.jpg" alt="Politecnico Grancolombiano"/>
    <div>
      <h1>Calendario de disponibilidad</h1>
      <small>Politecnico Grancolombiano</small>
    </div>
  </div>
  <nav><a href="/dashboard">Volver</a> <a href="/reservas/nueva">Nueva reserva</a></nav>
</header>
<main>
  <div class="card">
    <div class="filtros-cal">
      <div>
        <label for="filtroSeccion">Configuracion</label>
        <select id="filtroSeccion">
          <option value="">Todas (B1, B2, B3)</option>
          <option th:each="s : ${secciones}" th:value="${s}" th:text="${s}"></option>
        </select>
      </div>
      <button type="button" class="btn btn-amarillo" id="btnRefrescar">Actualizar</button>
    </div>
    <div class="leyenda">
      <span style="font-weight:700;color:#0F385A;">Referencias:</span>
      <span class="leyenda-item"><span class="leyenda-dot" style="background:#1f6feb;"></span> B1</span>
      <span class="leyenda-item"><span class="leyenda-dot" style="background:#2da44e;"></span> B2</span>
      <span class="leyenda-item"><span class="leyenda-dot" style="background:#bf8700;"></span> B3</span>
      <span class="leyenda-item"><span class="leyenda-dot" style="background:#cf222e;"></span> Auditorio completo</span>
      <span class="leyenda-item"><span class="leyenda-dot" style="background:#6b2737;"></span> Bloqueo</span>
      <span class="leyenda-item"><span class="leyenda-dot" style="background:#1f6feb99;border:1px dashed #888;"></span> Pendiente</span>
    </div>
    <div id="calendar"></div>
  </div>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'timeGridWeek',
    locale: 'es',
    slotMinTime: '08:00:00',
    slotMaxTime: '21:00:00',
    nowIndicator: true,
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },
    eventDidMount: function(info) {
      if (info.event.extendedProps.tipo === 'bloqueo') {
        info.el.style.opacity = '0.85';
        info.el.style.cursor = 'default';
        info.el.title = info.event.title.replace('\u26D4 ', 'BLOQUEADO: ');
      }
    },
    events: function(info, success, failure) {
      const sec = document.getElementById('filtroSeccion').value;
      let url = '/api/disponibilidad?start=' + encodeURIComponent(info.startStr)
              + '&end=' + encodeURIComponent(info.endStr);
      if (sec) url += '&seccion=' + encodeURIComponent(sec);
      fetch(url).then(r => r.json()).then(success).catch(failure);
    }
  });
  cal.render();
  document.getElementById('filtroSeccion').addEventListener('change', () => cal.refetchEvents());
  document.getElementById('btnRefrescar').addEventListener('click', () => cal.refetchEvents());
});
</script>
<script src="/js/session-guard.js?v=3"></script>
</body>
</html>
