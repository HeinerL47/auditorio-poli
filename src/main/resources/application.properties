# Thymeleaf
spring.thymeleaf.cache=false

# CSS/JS/imagenes: cache largo (las plantillas usan ?v= en la URL)
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# ===== Correo (Gmail SMTP) =====
# Para habilitar el envio real define las variables de entorno:
#   MAIL_ENABLED=true
#   MAIL_USERNAME=tu.correo@gmail.com
#   MAIL_PASSWORD=app-password-de-16-caracteres
#   MAIL_FROM=tu.correo@gmail.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:auditorio@poligran.edu.co}}
# IMPORTANTE: cambiado a true. El sistema NO enviara correos si MAIL_USERNAME o MAIL_PASSWORD estan vacios.
app.mail.enabled=${MAIL_ENABLED:true}
# URL publica del sitio (se incluye como boton "Ir al Auditorio" en los correos)
app.public.url=${APP_PUBLIC_URL:http://localhost:8080}

# Logging - usa DEBUG para ver detalle SMTP en consola durante desarrollo
logging.level.co.edu.poligran=INFO
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG
