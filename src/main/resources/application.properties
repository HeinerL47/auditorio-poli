spring.application.name=Auditorio Poli
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ============================================================
# === MySQL                                                 ===
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=false

# ===== Correo (Gmail SMTP) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:auditorio@poligran.edu.co}}
app.mail.enabled=${MAIL_ENABLED:true}
app.public.url=${APP_PUBLIC_URL:http://localhost:8080}

# Logging
logging.level.co.edu.poligran=INFO
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG