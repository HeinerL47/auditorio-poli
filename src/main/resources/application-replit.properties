# Perfil REPLIT: usado solo cuando SPRING_PROFILES_ACTIVE=replit.
# Permite ejecutar la app en el preview de Replit sin necesidad de instalar MySQL.
# En tu equipo con IntelliJ NO uses este perfil: la app correra con MySQL como dice
# el application.properties principal.

spring.datasource.url=jdbc:h2:mem:auditorio_poli;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
